<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nano Banana Image Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .loading-spinner {
            border-top-color: #3b82f6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .markdown-body p {
            margin-bottom: 0.5em;
        }

        .thought-box {
            border-left: 3px solid #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.9em;
            color: #d8b4fe;
        }

        /* Tips 淡入淡出过渡效果 */
        #loadingTip {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <header class="glass-panel p-4 flex justify-between items-center z-10 shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🍌</span>
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Gemini Image Studio</h1>
        </div>
        <div class="flex gap-3 items-center">
            <input type="password" id="apiKey" placeholder="输入 API Key"
                class="bg-slate-800 border border-slate-600 rounded px-3 py-1 text-sm focus:outline-none focus:border-blue-500 transition w-48">
            <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-white underline">清空对话</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">

        <aside class="w-72 glass-panel flex flex-col p-4 overflow-y-auto border-r border-slate-700 hidden md:flex">
            <h2 class="text-sm font-semibold text-slate-400 mb-4 uppercase tracking-wider">设置</h2>

            <div class="mb-5">
                <label class="block text-xs text-slate-400 mb-1">模型 (Model)</label>
                <select id="modelSelect"
                    class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm focus:border-blue-500 outline-none">
                    <option value="gemini-2.5-flash-image">Gemini 2.5 Flash (Fast)</option>
                    <option value="gemini-3-pro-image-preview">Gemini 3 Pro (Advanced)</option>
                </select>
            </div>

            <div class="mb-5">
                <label class="block text-xs text-slate-400 mb-1">画幅比例 (Aspect Ratio)</label>
                <select id="aspectRatio"
                    class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm focus:border-blue-500 outline-none">
                    <option value="1:1">1:1 (Square)</option>
                    <option value="16:9">16:9 (Landscape)</option>
                    <option value="9:16">9:16 (Portrait)</option>
                    <option value="4:3">4:3</option>
                    <option value="3:4">3:4</option>
                </select>
            </div>

            <div id="proSettings" class="hidden border-t border-slate-700 pt-4">
                <div class="mb-1 text-xs font-bold text-purple-400">Pro 专属选项</div>

                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1">分辨率 (Resolution)</label>
                    <select id="imageSize"
                        class="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm focus:border-purple-500 outline-none">
                        <option value="1K">1K (Default)</option>
                        <option value="2K">2K (High)</option>
                        <option value="4K">4K (Ultra)</option>
                    </select>
                </div>

                <div class="flex items-center justify-between mb-4">
                    <label class="text-xs text-slate-400">Google Search Grounding</label>
                    <input type="checkbox" id="useGrounding" class="w-4 h-4 accent-purple-500">
                </div>
            </div>

            <div class="mt-auto border-t border-slate-700 pt-4">
                <div class="flex items-center justify-between">
                    <label class="text-xs text-slate-400">仅生成图片 (不含文本)</label>
                    <input type="checkbox" id="imageOnly" class="w-4 h-4 accent-blue-500">
                </div>
                <p class="text-[10px] text-slate-500 mt-1">勾选后模型将不返回描述文本，仅返回图片。</p>
            </div>
        </aside>

        <div class="flex-1 flex flex-col relative">
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 scroll-smooth pb-32">
                <div class="flex gap-4 max-w-3xl mx-auto">
                    <div
                        class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs shrink-0">
                        AI</div>
                    <div class="space-y-2">
                        <div class="bg-slate-800 p-4 rounded-lg rounded-tl-none shadow text-sm leading-relaxed">
                            <p>👋 嗨！我是你的 Gemini 图像助手。我可以帮你生成、编辑图片，或者进行风格迁移。</p>
                            <ul class="list-disc pl-5 mt-2 text-slate-400">
                                <li><strong>文生图</strong>：描述你想要的画面。</li>
                                <li><strong>图生图/编辑</strong>：上传图片并告诉我怎么修改 (例如："给猫戴上帽子")。</li>
                                <li><strong>风格迁移</strong>：上传照片并要求变成 "梵高风格"。</li>
                            </ul>
                            <p class="mt-2 text-xs text-slate-500">提示：使用 Gemini 3 Pro 可以获得更高的细节和文字渲染能力。</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="loadingOverlay"
                class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                <div
                    class="loading-spinner ease-linear rounded-full border-4 border-t-4 border-slate-600 h-12 w-12 mb-4">
                </div>
                <div class="text-center">
                    <p class="text-lg font-semibold text-white mb-1">正在生成中...</p>
                    <p id="timer" class="text-sm text-blue-400 font-mono mb-4">0.0s</p>
                    <div
                        class="max-w-md bg-slate-800/50 px-6 py-3 rounded-full border border-slate-700 flex items-center justify-center min-h-[60px]">
                        <p id="loadingTip" class="text-xs text-slate-300 italic text-center px-4">
                        </p>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-0 left-0 right-0 p-4 glass-panel border-t border-slate-700">
                <div class="max-w-4xl mx-auto relative">
                    <div id="imagePreviewContainer" class="flex gap-2 mb-2 overflow-x-auto scrollbar-hide empty:hidden">
                    </div>

                    <div class="flex gap-2">
                        <label
                            class="cursor-pointer p-3 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-slate-300 flex items-center justify-center shrink-0"
                            title="上传参考图片 (最多 14 张)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <input type="file" id="imageInput" class="hidden" multiple accept="image/*">
                        </label>

                        <textarea id="promptInput" rows="1"
                            class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-blue-500 resize-none overflow-hidden"
                            placeholder="描述你要生成的图像... (Shift+Enter 换行)"></textarea>

                        <button onclick="handleGenerate()" id="sendBtn"
                            class="bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-lg font-semibold transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                            <span>生成</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-1 text-right px-1">所有生成的图像包含 SynthID 水印</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Configuration & State ---
        const TIPS = [
            // 基础提示词技巧
            "Tip: 描述场景而不是简单的堆砌关键词，讲一个故事效果会更好。",
            "Tip: 使用摄影术语（如 '85mm portrait lens', 'bokeh', 'golden hour'）可获得照片级真实感。",
            "Tip: 想要生成文字？明确描述字体风格（如 'bold sans-serif'）和位置。",
            "Tip: 使用 'Cinematic lighting'（电影布光）可以瞬间提升画面的质感。",
            "Tip: 想要极简风格？尝试使用关键词 'Minimalist', 'Negative space'。",
            "Tip: 不想要某些元素？与其说 'no cars'，不如描述 'an empty deserted street' (语义化反向描述)。",

            // 模型特性
            "Tip: Gemini 3 Pro (Advanced) 支持生成高达 4K 分辨率的超清图像。",
            "Tip: Gemini 3 Pro 拥有 'Thinking' 过程，能先思考构图再生成，适合复杂指令。",
            "Tip: Gemini 2.5 Flash 专为速度优化，适合快速迭代和测试灵感。",
            "Tip: 所有生成的图像都包含 SynthID 水印，肉眼不可见但可被识别。",

            // 编辑与多模态
            "Tip: 想要修改图片？上传原图并说 'Change the [X] to [Y]' 即可。",
            "Tip: 上传一张草图，让 AI 帮你 'Turn this sketch into a finished product photo'。",
            "Tip: 保持角色一致性：在 Gemini 3 Pro 中可以上传最多 14 张参考图！",
            "Tip: 风格迁移：上传一张照片，再上传一张 '星夜'，让 AI 融合两者风格。",
            "Tip: 想要移除背景？虽然不能直接透明，但可以要求 'pure white background' 方便后期抠图。",

            // 艺术风格推荐
            "Tip: 试试 'Cyberpunk' 或 'Synthwave' 风格，获得霓虹灯和未来感。",
            "Tip: 'Isometric view' (等轴测视图) 非常适合生成游戏资产或 3D 图标。",
            "Tip: 'Knolling' 风格可以将物体整齐排列，适合展示装备或工具。",
            "Tip: 'Ukiyo-e' 可以生成浮世绘风格的艺术作品。",
            "Tip: 'Claymation' 或 'Stop motion' 可以生成粘土动画风格的可爱图像。",
            "Tip: 'Line art' 风格适合制作涂色书或黑白线稿。",
            "Tip: 'Impasto' 风格会模拟厚重的油画笔触质感。",
            "Tip: 'Double exposure' (双重曝光) 可以将人像和风景艺术性地融合。",
            "Tip: 'Paper quilling' (衍纸艺术) 能生成极其复杂的纸艺效果。",
            "Tip: 'Low poly' 风格适合生成复古游戏感的低多边形图像。",

            // 场景与视角
            "Tip: 尝试 'Macro shot' (微距摄影) 来观察昆虫或露珠的惊人细节。",
            "Tip: 'Drone view' 或 'Bird\'s eye view' 适合展示城市规划或大场景。",
            "Tip: 'Low angle shot' (低角度仰拍) 可以让人物或建筑看起来更宏伟。",
            "Tip: 'Studio lighting' 和 'Product shot' 是电商图生成的必备词汇。",
            "Tip: 想要做贴纸？记得加上 'Die-cut sticker' 和 'White border'。",

            // 高级用法
            "Tip: 开启 'Google Search Grounding' (仅 Pro)，可以根据实时天气或股价生成图表。",
            "Tip: 制作连环画：描述 '3 panel comic' 并上传角色图以保持一致性。",
            "Tip: 对于复杂的逻辑，Gemini 3 Pro 会生成中间的 '思维图像' (Thinking Image)。",
            "Tip: 觉得画面太乱？尝试加上 'Clean composition' 或 'Symmetrical'。",
            "Tip: 不满意结果？与其重写，不如继续对话：'Make the light warmer'。"
        ];

        let chatHistory = []; // Stores the full conversation context
        let uploadedImages = []; // Stores base64 images for the current turn
        let isGenerating = false;
        let editingTargetIndex = null; // Index of the user message being edited
        let timerInterval;
        let tipsInterval;

        // --- DOM Elements ---
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const proSettings = document.getElementById('proSettings');
        const promptInput = document.getElementById('promptInput');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const chatContainer = document.getElementById('chatContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const timerDisplay = document.getElementById('timer');
        const loadingTip = document.getElementById('loadingTip');

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) apiKeyInput.value = savedKey;

            modelSelect.addEventListener('change', updateUIForModel);
            updateUIForModel(); // Init state

            // Auto-resize textarea
            promptInput.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if (this.value === '') this.style.height = 'auto';
            });

            // Enter key to submit
            promptInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    // Prevent submit if purely empty (unless has images)
                    if (!promptInput.value.trim() && uploadedImages.length === 0) return;
                    handleGenerate();
                }
            });

            // Escape to cancel edit
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && editingTargetIndex !== null) {
                    cancelEdit();
                }
            });

            // API Key saving
            apiKeyInput.addEventListener('change', () => {
                localStorage.setItem('gemini_api_key', apiKeyInput.value);
            });
        });

        function updateUIForModel() {
            const model = modelSelect.value;
            if (model === 'gemini-3-pro-image-preview') {
                proSettings.classList.remove('hidden');
            } else {
                proSettings.classList.add('hidden');
            }
        }

        // --- Image Handling ---
        imageInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            for (const file of files) {
                const base64 = await fileToBase64(file);
                // Store raw base64 (without prefix) for API
                const rawBase64 = base64.split(',')[1];
                uploadedImages.push({
                    mime_type: file.type,
                    data: rawBase64,
                    preview: base64 // keep full string for UI preview
                });
            }
            renderImagePreviews();
            imageInput.value = ''; // Reset input
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function renderImagePreviews() {
            imagePreviewContainer.innerHTML = '';
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'relative group w-16 h-16 shrink-0';
                div.innerHTML = `
                    <img src="${img.preview}" class="w-full h-full object-cover rounded border border-slate-600">
                    <button onclick="removeImage(${index})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition">×</button>
                `;
                imagePreviewContainer.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        async function handleGenerate() {
            const text = promptInput.value.trim();
            const apiKey = apiKeyInput.value.trim();

            if (!apiKey) {
                alert('请先输入 API Key');
                return;
            }
            if (!text && uploadedImages.length === 0) {
                alert('请输入提示词或上传图片');
                return;
            }
            if (isGenerating) return;

            // UI Prep
            isGenerating = true;
            startLoading();
            const currentModel = modelSelect.value;

            try {
                // If editing, truncate history up to the edit point
                if (editingTargetIndex !== null) {
                    // editingTargetIndex points to the user message in chatHistory
                    // We remove everything from that index onwards
                    chatHistory = chatHistory.slice(0, editingTargetIndex);
                    // Reset edit state
                    cancelEdit(false); // pass false to not clear input since we use it below
                }

                // Construct Current Turn
                const userParts = [];
                if (text) userParts.push({ text: text });
                uploadedImages.forEach(img => {
                    userParts.push({
                        inline_data: {
                            mime_type: img.mime_type,
                            data: img.data
                        }
                    });
                });

                const currentTurn = {
                    role: "user",
                    parts: userParts
                };

                // Add to history NOW, so renderChat shows it
                chatHistory.push(currentTurn);
                renderChat(); 

                // Build request contents
                const contents = [...chatHistory]; // Already includes currentTurn

                const config = {
                    responseModalities: document.getElementById('imageOnly').checked ? ["IMAGE"] : ["TEXT", "IMAGE"],
                    imageConfig: {
                        aspectRatio: document.getElementById('aspectRatio').value
                    }
                };

                // Pro specific configs
                if (currentModel === 'gemini-3-pro-image-preview') {
                    config.imageConfig.imageSize = document.getElementById('imageSize').value;
                }

                const payload = {
                    contents: contents,
                    generationConfig: config
                };

                // Grounding (Pro only)
                if (currentModel === 'gemini-3-pro-image-preview' && document.getElementById('useGrounding').checked) {
                    payload.tools = [{ google_search: {} }];
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API Request Failed');
                }

                // Process Response
                const candidate = data.candidates?.[0];
                if (!candidate) throw new Error('No content generated');

                // Add model turn
                chatHistory.push(candidate.content);
                renderChat();

                // Cleanup
                promptInput.value = '';
                uploadedImages = [];
                renderImagePreviews();
                promptInput.style.height = 'auto';

            } catch (error) {
                console.error(error);
                appendError(error.message);
                // Note: If error occurs, the user message is already in history. 
                // We might want to pop it if we encourage retry, but keeping it allows simple "Regenerate".
                // For now, simple error display.
            } finally {
                stopLoading();
                isGenerating = false;
            }
        }

        // --- Edit Logic ---

        function startEditing(index) {
            if (isGenerating) return;

            const turn = chatHistory[index];
            if (!turn || turn.role !== 'user') return;

            editingTargetIndex = index;

            // Restore text
            const textPart = turn.parts.find(p => p.text);
            if (textPart) {
                promptInput.value = textPart.text;
                // Trigger auto-resize
                promptInput.style.height = 'auto';
                promptInput.style.height = (promptInput.scrollHeight) + 'px';
            } else {
                promptInput.value = '';
            }

            // Note: We are currently NOT restoring images to the upload queue to keep it simple,
            // as re-converting base64 to file objects specifically is tricky and user might just want to edit text.
            // If they want to keep images, they are effectively "re-sending" them if they are in the history? 
            // Actually, if we truncate, those images are GONE from history.
            // So if we edit a message with images, we strictly should restore them.
            // Let's at least try to restore them to `uploadedImages` state if possible, 
            // or warn user? 
            // For now, we will handle text editing primarily. 
            // If the message had images, they are lost if not re-added.
            // Improvement: Check for inline_data and restore to uploadedImages.
            
            uploadedImages = [];
            turn.parts.forEach(p => {
                if (p.inline_data) {
                    // metadata for API
                    uploadedImages.push({
                        mime_type: p.inline_data.mime_type,
                        data: p.inline_data.data,
                        preview: `data:${p.inline_data.mime_type};base64,${p.inline_data.data}`
                    });
                }
            });
            renderImagePreviews();

            // UI updates
            document.getElementById('sendBtn').innerHTML = `
                <span>更新 & 提交</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            `;
            document.getElementById('sendBtn').classList.replace('bg-blue-600', 'bg-purple-600');
            document.getElementById('sendBtn').classList.replace('hover:bg-blue-500', 'hover:bg-purple-500');
            
            promptInput.focus();
            
            // Show a toast or indicator?
            const toast = document.createElement('div');
            toast.id = 'editToast';
            toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-purple-900/90 text-white px-4 py-2 rounded-full text-sm shadow-lg z-50 flex items-center gap-2 animate-bounce';
            toast.innerHTML = `<span>正在编辑之前的消息 (按 Esc 取消)</span> <button onclick="cancelEdit()" class="hover:text-gray-300">✕</button>`;
            if(!document.getElementById('editToast')) document.body.appendChild(toast);
        }

        function cancelEdit(clearInput = true) {
            editingTargetIndex = null;
            if (clearInput) {
                promptInput.value = '';
                uploadedImages = [];
                renderImagePreviews();
                promptInput.style.height = 'auto';
            }
            
            // Reset Button
            const btn = document.getElementById('sendBtn');
            btn.innerHTML = `
                <span>生成</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            `;
            btn.classList.replace('bg-purple-600', 'bg-blue-600');
            btn.classList.replace('hover:bg-purple-500', 'hover:bg-blue-500');

            // Remove toast
            const toast = document.getElementById('editToast');
            if(toast) toast.remove();
        }

        // --- UI Rendering Helpers ---

        function renderChat() {
            chatContainer.innerHTML = '';
             // Always show welcome if history is empty? 
             // Logic in original code only had welcome hardcoded in HTML.
             // We should preserve the welcome message if possible or re-render it.
             // The original HTML had the welcome message inside #chatContainer.
             // Since we clear #chatContainer, we lose it.
             // Let's add it back if history is empty, or just render history.
             
             if (chatHistory.length === 0) {
                 chatContainer.innerHTML = `
                <div class="flex gap-4 max-w-3xl mx-auto">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs shrink-0">AI</div>
                    <div class="space-y-2">
                        <div class="bg-slate-800 p-4 rounded-lg rounded-tl-none shadow text-sm leading-relaxed">
                            <p>👋 嗨！我是你的 Gemini 图像助手。我可以帮你生成、编辑图片，或者进行风格迁移。</p>
                            <ul class="list-disc pl-5 mt-2 text-slate-400">
                                <li><strong>文生图</strong>：描述你想要的画面。</li>
                                <li><strong>图生图/编辑</strong>：上传图片并告诉我怎么修改 (例如："给猫戴上帽子")。</li>
                                <li><strong>风格迁移</strong>：上传照片并要求变成 "梵高风格"。</li>
                            </ul>
                            <p class="mt-2 text-xs text-slate-500">提示：使用 Gemini 3 Pro 可以获得更高的细节和文字渲染能力。</p>
                        </div>
                    </div>
                </div>`;
                return;
             }

             chatHistory.forEach((turn, index) => {
                 if (turn.role === 'user') {
                     renderUserTurn(turn, index);
                 } else {
                     renderModelTurn(turn);
                 }
             });
             scrollToBottom();
        }

        function renderUserTurn(turn, index) {
            const div = document.createElement('div');
            // Add 'group' class to handle hover visibility of edit button
            div.className = `flex gap-4 max-w-3xl mx-auto justify-end group`;

            let contentHtml = '';

            // Extract images
            const images = turn.parts
                .filter(p => p.inline_data)
                .map(p => `data:${p.inline_data.mime_type};base64,${p.inline_data.data}`);

            // Extract text
            const textPart = turn.parts.find(p => p.text);
            const text = textPart ? textPart.text : '';

            // Render Images
            if (images.length > 0) {
                contentHtml += `<div class="flex flex-wrap gap-2 mb-2 justify-end">`;
                images.forEach(src => {
                    contentHtml += `<img src="${src}" class="h-24 rounded border border-slate-600">`;
                });
                contentHtml += `</div>`;
            }

            // Render Text
            if (text) {
                contentHtml += `<div class="bg-blue-600 text-white px-4 py-3 rounded-lg max-w-[85%] text-sm whitespace-pre-wrap leading-relaxed shadow relative">
                    ${text}
                </div>`;
            }

            // Edit Button (Visible on hover)
            const editBtn = `
                <button onclick="startEditing(${index})" class="self-start mt-2 text-slate-500 hover:text-white opacity-0 group-hover:opacity-100 transition p-1" title="编辑">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </button>
            `;

            div.innerHTML = `
                ${editBtn}
                <div class="flex flex-col items-end space-y-2">${contentHtml}</div>
                <div class="w-8 h-8 rounded-full bg-slate-500 flex items-center justify-center text-xs font-bold text-white shrink-0">You</div>
            `;

            chatContainer.appendChild(div);
        }

        function renderModelTurn(turn) {
            // Re-use logic from old appendModelResponse but adapted for object input
            // The old appendModelResponse took `parts`. `turn` is `{role: 'model', parts: [...]}`
            const parts = turn.parts;
            
            const div = document.createElement('div');
            div.className = "flex gap-4 max-w-3xl mx-auto";

            let innerContent = '';
            let hasThought = false;
            let thoughtsHtml = '';
            let finalContentHtml = '';

            parts.forEach(part => {
                // 1. Thinking Process
                if (part.thought) {
                    hasThought = true;
                    if (part.text) {
                        thoughtsHtml += `<div class="thought-box mb-1">🤔 <strong>Thinking:</strong> ${marked.parse(part.text)}</div>`;
                    }
                    if (part.inlineData || part.inline_data) {
                        const imgData = part.inlineData ? part.inlineData.data : part.inline_data.data;
                        thoughtsHtml += `<div class="thought-box mb-1"><img src="data:image/png;base64,${imgData}" class="max-h-48 rounded opacity-70" title="Intermediate thought image"></div>`;
                    }
                }
                // 2. Final Output (Text)
                else if (part.text) {
                    finalContentHtml += `<div class="markdown-body mb-4">${marked.parse(part.text)}</div>`;
                }
                // 3. Final Output (Images)
                else if (part.inlineData || part.inline_data) {
                    const imgData = part.inlineData ? part.inlineData.data : part.inline_data.data;
                    const mime = part.inlineData ? part.inlineData.mimeType : part.inline_data.mime_type;

                    finalContentHtml += `
                        <div class="mb-4 group relative inline-block">
                            <img src="data:${mime};base64,${imgData}" class="rounded-lg shadow-lg max-w-full border border-slate-700" loading="lazy">
                            <a href="data:${mime};base64,${imgData}" download="gemini-gen-${Date.now()}.png" class="absolute bottom-2 right-2 bg-slate-900/80 text-white p-2 rounded hover:bg-blue-600 transition opacity-0 group-hover:opacity-100 text-xs flex items-center gap-1">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                Download
                            </a>
                        </div>
                    `;
                }
            });

            let fullHtml = `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-xs shrink-0">AI</div><div class="flex-1 bg-slate-800 p-4 rounded-lg rounded-tl-none shadow text-slate-200 text-sm leading-relaxed overflow-hidden">`;

            if (hasThought) {
                fullHtml += `<details class="mb-4 cursor-pointer"><summary class="text-xs text-purple-400 font-semibold select-none hover:text-purple-300">查看思维过程 (Thinking Process)</summary><div class="mt-2 p-2 bg-slate-900/50 rounded">${thoughtsHtml}</div></details>`;
            }

            fullHtml += finalContentHtml;
            fullHtml += `</div>`;

            div.innerHTML = fullHtml;
            chatContainer.appendChild(div);
        }


        function appendError(msg) {
            const div = document.createElement('div');
            div.className = "flex gap-4 max-w-3xl mx-auto";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-red-600 flex items-center justify-center text-white text-xs shrink-0">!</div>
                <div class="bg-red-900/30 border border-red-800 p-4 rounded-lg text-red-200 text-sm">
                    <strong>Error:</strong> ${msg}
                </div>
            `;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            if (confirm('确定清空所有对话历史吗？')) {
                chatHistory = [];
                chatContainer.innerHTML = ''; // Keep welcome msg if wanted, or clear all
                location.reload(); // Simple reload to reset state cleanly
            }
        }

        // --- Loading Animation Logic ---
        function startLoading() {
            loadingOverlay.classList.remove('hidden');
            let startTime = Date.now();

            // 1. 随机选择初始 Tip
            let randomStart = Math.floor(Math.random() * TIPS.length);
            loadingTip.innerText = TIPS[randomStart];

            // 2. 计时器 (每 0.1 秒更新时间)
            timerInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                timerDisplay.innerText = `${elapsed}s`;
            }, 100);

            // 3. Tips 轮播 (每 6 秒随机切换，带淡入淡出)
            tipsInterval = setInterval(() => {
                loadingTip.style.opacity = 0; // Fade out
                setTimeout(() => {
                    // 随机抽取一个新的 Tip (确保不太可能连续重复，虽然几率很小)
                    let randomIndex = Math.floor(Math.random() * TIPS.length);
                    loadingTip.innerText = TIPS[randomIndex];
                    loadingTip.style.opacity = 1; // Fade in
                }, 300); // Wait for fade out
            }, 6000); // 间隔延长至 6秒
        }

        function stopLoading() {
            loadingOverlay.classList.add('hidden');
            clearInterval(timerInterval);
            clearInterval(tipsInterval); // 清除 Tips 定时器
            timerDisplay.innerText = '0.0s';
            loadingTip.style.opacity = 1; // 重置透明度
        }
    </script>
</body>

</html>
